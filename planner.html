<script>
// ═══════════════════════════════════════════════════════
//  GWB CLIENT INTAKE FORM
//  Submits to Google Apps Script → Platform auto-populates
// ═══════════════════════════════════════════════════════

// ── CONFIGURATION — paste your Apps Script URL here after deploying ──
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsgDVWhzYIE22SX-G8oB8hVhjVG7uLXJUEGTCocj9WB_tP49fBhJBevv11euLZQveF/exec';
const SCRIPT_KEY = 'GWB2025';

const SECTION_NAMES = [
  '','Personal Details','Income','Expenses',
  'Debts','Savings & Assets','Protection',
  'Health','Session Goals'
];

let currentSection = 1;
const TOTAL_SECTIONS = 8;

// ── NAVIGATION ──────────────────────────────────────────
function nextSection(n) {
  if (!validateSection(n)) return;
  hideSection(n);
  showSection(n + 1);
  currentSection = n + 1;
  updateProgress(n + 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevSection(n) {
  hideSection(n);
  showSection(n - 1);
  currentSection = n - 1;
  updateProgress(n - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function hideSection(n) {
  document.getElementById('section-' + n).classList.remove('active');
}

function showSection(n) {
  document.getElementById('section-' + n).classList.add('active');
}

function updateProgress(n) {
  const pct = ((n - 1) / TOTAL_SECTIONS) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-step-label').textContent = 'Section ' + n + ' of ' + TOTAL_SECTIONS;
  document.getElementById('progress-count-label').textContent = SECTION_NAMES[n];
}

// ── SPOUSE INCOME TOGGLE ────────────────────────────────
function toggleSpouse(show) {
  const field = document.getElementById('spouse-salary-field');
  field.classList.toggle('show', show);
}

// ── VALIDATION ──────────────────────────────────────────
function validateSection(n) {
  let valid = true;
  const section = document.getElementById('section-' + n);
  section.querySelectorAll('[required]').forEach(el => {
    el.classList.remove('f-error');
    if (!el.value.trim()) {
      el.classList.add('f-error');
      valid = false;
    }
  });
  // Radio groups with required
  if (n === 2) {
    const spouseChecked = document.querySelector('input[name="f_spouse_inc"]:checked');
    if (!spouseChecked) {
      valid = false;
      alert('Please select your spouse / partner income status.');
    }
  }
  if (n === 8) {
    const reasonChecked = document.querySelector('input[name="f_reason"]:checked');
    if (!reasonChecked) {
      valid = false;
      alert('Please tell us what brought you here today.');
    }
  }
  if (!valid) {
    const firstErr = section.querySelector('.f-error');
    if (firstErr) firstErr.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  return valid;
}

// ── COLLECT FORM DATA ───────────────────────────────────
function collectData() {
  const gv = id => parseFloat(document.getElementById(id)?.value) || 0;
  const gs = id => document.getElementById(id)?.value || '';
  const gr = name => document.querySelector(`input[name="${name}"]:checked`)?.value || '';
  const gc = id => document.getElementById(id)?.checked || false;

  return {
    // Meta
    submitted_at: new Date().toISOString(),
    source: 'intake_form',

    // Profile
    name: gs('f_name'),
    age: gv('f_age'),
    whatsapp: gs('f_whatsapp'),
    email: gs('f_email'),
    marital: gs('f_marital'),
    emp: gs('f_emp'),
    dependents: gv('f_dependents'),
    youngest: gv('f_youngest'),
    will: gr('f_will'),
    business: gr('f_business') || 'no',

    // Income
    salary: gv('f_salary'),
    business_inc: gv('f_business_inc'),
    side_inc: gv('f_side_inc'),
    passive_inc: gv('f_passive_inc'),
    spouse_income: gr('f_spouse_inc') || 'none',
    spouse_salary: gv('f_spouse_salary'),

    // Expenses
    e_housing: gv('f_e_housing'),
    e_school: gv('f_e_school'),
    e_food: gv('f_e_food'),
    e_transport: gv('f_e_transport'),
    e_utilities: gv('f_e_utilities'),
    e_medical: gv('f_e_medical'),
    e_insurance: gv('f_e_insurance'),
    e_remittance: gv('f_e_remittance'),
    e_other: gv('f_e_other'),

    // Debts
    d_mortgage: gv('f_d_mortgage'),
    d_vehicle: gv('f_d_vehicle'),
    d_personal: gv('f_d_personal'),
    d_credit: gv('f_d_credit'),
    d_business: gv('f_d_business'),
    d_monthly: gv('f_d_monthly'),

    // Savings & Assets
    s_emergency: gv('f_s_emergency'),
    s_cash: gv('f_s_cash'),
    s_portfolio: gv('f_s_portfolio'),
    s_retirement: gv('f_s_retirement'),
    s_monthly: gv('f_s_monthly'),
    a_property: gv('f_a_property'),
    a_business: gv('f_a_business'),

    // Insurance
    life_status: gr('f_life_status') || 'none',
    ins_life: gv('f_ins_life'),
    ins_funeral: gv('f_ins_funeral'),
    ins_disability: gv('f_ins_disability'),
    ins_premium: gv('f_ins_premium'),

    // Health
    health: gs('f_health') || 'good',
    smoker: gs('f_smoker') || 'no',
    c_diabetes: gc('f_c_diabetes'),
    c_hypertension: gc('f_c_hypertension'),
    c_heart: gc('f_c_heart'),
    c_cancer: gc('f_c_cancer'),
    c_hiv: gc('f_c_hiv'),

    // Session
    reason: gr('f_reason'),
    readiness: gr('f_readiness') || 'exploring',
    budget: gv('f_budget'),
    notes: gs('f_notes'),
  };
}

// ── SUBMIT ──────────────────────────────────────────────
async function submitForm() {
  if (!validateSection(8)) return;

  const data = collectData();
  document.getElementById('submitting-overlay').classList.add('show');

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'intake', key: SCRIPT_KEY, data }),
      headers: { 'Content-Type': 'text/plain' },
      redirect: 'follow'
    });
    const text = await response.text();
    const result = JSON.parse(text);
    if (!result.success) console.error('Server error:', result.error);
  } catch(e) {
    console.error('Submission error:', e);
  }

  document.getElementById('submitting-overlay').classList.remove('show');

  // Show thank you
  document.getElementById('gwb-form').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  document.getElementById('hero-section').style.display = 'none';
  document.getElementById('thankyou-screen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

<script>
(function(){

  // ── 0. Service Worker registration (Android/Chrome only) ─────
  var _ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!_ios && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  // ── 1. Manifest ──────────────────────────────────────────────
  const PAGE_URL  = window.location.href.split('?')[0].split('#')[0];
  const PAGE_PATH = window.location.pathname || '/';
  // Use static icon files (data: URIs are not accepted by Chrome's install criteria)
  const BASE      = PAGE_URL.replace(/\/[^/]*$/, '/');
  const ICON_192  = BASE + 'icon-192.png';
  const ICON_512  = BASE + 'icon-512.png';

  const manifest = {
    name: 'WealthPath',
    short_name: 'WealthPath',
    description: 'Your personal financial planner by WealthPath',
    start_url: PAGE_URL,
    scope: PAGE_PATH,
    display: 'standalone',
    orientation: 'portrait-primary',
    background_color: '#0A1628',
    theme_color: '#0A1628',
    lang: 'en',
    categories: ['finance','productivity'],
    icons: [
      { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(mBlob);
  document.getElementById('apple-icon').href = ICON_192;

  // ── 2. Helpers ───────────────────────────────────────────────
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || (navigator.standalone === true);

  // Don't show any install UI if already installed
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase());

  // ── 3. Android/Chrome — native install prompt ────────────────
  const androidDismissed = parseInt(localStorage.getItem('gwb-dismissed')||'0');
  const androidSnoozed   = (Date.now() - androidDismissed) < 7*24*60*60*1000;

  let deferredPrompt = null;

  if(!androidSnoozed && !isIOS){
    window.addEventListener('beforeinstallprompt', e=>{
      e.preventDefault();
      deferredPrompt = e;
      showAndroidBanner();
    });
  }

  function showAndroidBanner(){
    if(document.getElementById('gwb-banner')) return;

    const b = document.createElement('div');
    b.id = 'gwb-banner';
    b.style.cssText = [
      'position:fixed;bottom:0;left:0;right:0;z-index:99999',
      'background:linear-gradient(160deg,#0A1628 0%,#132040 100%)',
      'border-top:2px solid #B8923A',
      'padding:14px 16px',
      'padding-bottom:calc(14px + env(safe-area-inset-bottom))',
      'display:flex;align-items:center;gap:12px',
      'font-family:Inter,system-ui,sans-serif',
      'box-shadow:0 -4px 24px rgba(0,0,0,.45)',
      'animation:gwbSlideUp .28s cubic-bezier(.4,0,.2,1)',
    ].join(';');

    // Logo icon
    const logoEl = document.querySelector('.lm img');
    const iconHTML = logoEl
      ? `<img src="${logoEl.src}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0">`
      : `<div style="width:42px;height:42px;border-radius:10px;background:#B8923A;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">&#128176;</div>`;

    b.innerHTML = `
      <style>@keyframes gwbSlideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}</style>
      ${iconHTML}
      <div style="flex:1;min-width:0">
        <div style="color:#fff;font-size:13.5px;font-weight:700;line-height:1.2">Install WealthPath</div>
        <div style="color:rgba(255,255,255,.5);font-size:11.5px;margin-top:2px;line-height:1.3">Add to home screen for one-tap access</div>
      </div>
      <button id="gwb-b-no"
        style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;
               padding:8px 12px;color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;
               font-family:inherit;white-space:nowrap;flex-shrink:0">
        Later
      </button>
      <button id="gwb-b-yes"
        style="background:linear-gradient(135deg,#B8923A,#D4AA5A);border:none;border-radius:8px;
               padding:8px 16px;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;
               font-family:inherit;white-space:nowrap;flex-shrink:0;
               box-shadow:0 3px 12px rgba(184,146,58,.45)">
        Install
      </button>`;

    document.body.appendChild(b);

    document.getElementById('gwb-b-yes').onclick = async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const {outcome} = await deferredPrompt.userChoice;
      deferredPrompt = null;
      b.remove();
    };
    document.getElementById('gwb-b-no').onclick = ()=>{
      b.remove();
      localStorage.setItem('gwb-dismissed', Date.now());
    };
  }

  // ── 4. iOS Safari — step-by-step bottom sheet ────────────────
  const iosDismissed = parseInt(localStorage.getItem('gwb-ios-dismissed')||'0');
  const iosSnoozed   = (Date.now() - iosDismissed) < 7*24*60*60*1000;

  if(isIOS && !iosSnoozed){
    // Show after 3s once the auth screen has loaded
    setTimeout(()=>{
      if(document.getElementById('gwb-ios')) return;

      const logoEl = document.querySelector('.lm img');
      const iconHTML = logoEl
        ? `<img src="${logoEl.src}" style="width:38px;height:38px;border-radius:9px;object-fit:cover">`

      const h = document.createElement('div');
      h.id = 'gwb-ios';
      h.style.cssText = [
        'position:fixed;bottom:0;left:0;right:0;z-index:99999',
        'background:linear-gradient(160deg,#0A1628 0%,#132040 100%)',
        'border-top:2px solid #B8923A',
        'border-radius:22px 22px 0 0',
        'padding:0 18px',
        'padding-bottom:calc(20px + env(safe-area-inset-bottom))',
        'font-family:Inter,system-ui,sans-serif',
        'box-shadow:0 -6px 32px rgba(0,0,0,.5)',
        'animation:gwbSlideUp .28s cubic-bezier(.4,0,.2,1)',
      ].join(';');

      h.innerHTML = `
        <style>@keyframes gwbSlideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}</style>
        <!-- Handle -->
        <div style="width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:14px auto 18px;"></div>

        <!-- Header row -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:10px">
            ${iconHTML}
            <div>
              <div style="color:#fff;font-size:15px;font-weight:700">Install WealthPath</div>
              <div style="color:rgba(255,255,255,.4);font-size:11.5px;margin-top:2px">Save to your home screen</div>
            </div>
          </div>
          <button id="gwb-ios-x"
            style="background:rgba(255,255,255,.1);border:none;border-radius:50%;
                   width:30px;height:30px;color:rgba(255,255,255,.6);font-size:18px;
                   cursor:pointer;display:flex;align-items:center;justify-content:center;
                   flex-shrink:0;line-height:1">&times;</button>
        </div>

        <!-- Step 1 -->
        <div style="background:rgba(255,255,255,.07);border-radius:12px;padding:13px 14px;
                    display:flex;align-items:flex-start;gap:12px;margin-bottom:8px">
          <div style="font-size:18px;flex-shrink:0;line-height:1.2">1️⃣</div>
          <div style="color:rgba(255,255,255,.75);font-size:13px;line-height:1.55">
            Tap the <strong style="color:#D4AA5A">Share</strong> button
            <span style="display:inline-block;background:rgba(255,255,255,.15);border-radius:5px;
                          padding:1px 7px;font-size:13px;color:#fff;margin:0 2px">&#11014;&#65038;</span>
            at the bottom of Safari
          </div>
        </div>

        <!-- Step 2 -->
        <div style="background:rgba(255,255,255,.07);border-radius:12px;padding:13px 14px;
                    display:flex;align-items:flex-start;gap:12px">
          <div style="font-size:18px;flex-shrink:0;line-height:1.2">2️⃣</div>
          <div style="color:rgba(255,255,255,.75);font-size:13px;line-height:1.55">
            Tap <strong style="color:#D4AA5A">"Add to Home Screen"</strong>
            then tap <strong style="color:#D4AA5A">Add</strong>
          </div>
        </div>`;

      document.body.appendChild(h);
      document.getElementById('gwb-ios-x').onclick = ()=>{
        h.style.animation = 'gwbSlideDown .22s cubic-bezier(.4,0,.2,1) forwards';
        setTimeout(()=>h.remove(), 220);
        localStorage.setItem('gwb-ios-dismissed', Date.now());
      };

  }

})();
