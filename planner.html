<!DOCTYPE html>

<head>
<!-- SW kill-switch: runs before anything else, unregisters any broken service worker then reloads once -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(regs.length > 0){
      Promise.all(regs.map(function(r){ return r.unregister(); })).then(function(){
        if(!sessionStorage.getItem('sw-cleared')){
          sessionStorage.setItem('sw-cleared','1');
          location.reload();
        }
      });
    }
  });
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#B8923A;--gold-l:#D4AA5A;--gold-p:#FBF3E3;--gold-d:#8A6A22;
  --navy:#0A1628;--navy-l:#132040;--navy-2:#1E3055;
  --off:#F7F8FA;--card:#FFFFFF;--border:#EAECF0;--border-l:#F2F4F7;
  --mg:#7A8499;--dk:#0D1117;--mid:#3D4A5C;
  --green:#12A150;--red:#E02D3C;--amber:#F59E0B;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);
}

html,body{font-family:var(--sans);background:#fff;color:var(--dk);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:var(--sans);box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:#4A6FA5!important;box-shadow:0 0 0 3px rgba(74,111,165,.12);outline:none}
button{cursor:pointer;transition:all .15s}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:10px}

/* ── AUTH ── */
.aw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--navy) 0%,var(--navy-l) 50%,var(--navy-2) 100%);padding:20px;position:relative;overflow:hidden}
.aw::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(184,146,58,.08) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none}
.aw::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(184,146,58,.06) 0%,transparent 70%);bottom:-80px;left:-80px;pointer-events:none}
.aw-topline{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold) 40%,var(--gold-l) 60%,transparent 100%)}
.ac{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:var(--r-xl);padding:48px 44px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.3)}
.alogo{text-align:center;margin-bottom:32px}
.alogo img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto;background:#fff;border-radius:8px;}
.alogo-s{font-size:10px;letter-spacing:.2em;color:var(--mg);text-transform:uppercase;font-family:var(--sans);margin-top:10px;font-weight:500}
.adiv{width:32px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto}
.alogo-p{font-size:11px;letter-spacing:.12em;color:var(--mg);text-transform:uppercase;font-family:var(--sans);font-weight:500}
.atitle{font-size:22px;font-weight:700;text-align:center;color:var(--navy);margin-bottom:28px;letter-spacing:-.3px}
.lbl{display:block;font-size:11px;letter-spacing:.03em;color:var(--mid);margin-bottom:6px;font-weight:500}
.ain{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--dk);background:#fff;outline:none;transition:all .2s}
.ain:hover{border-color:#C0C8D8}
.fld{margin-bottom:16px}
.gbtn{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 100%);color:#fff;border:none;border-radius:var(--r-sm);padding:13px;font-size:12px;letter-spacing:.04em;font-weight:600;width:100%;cursor:pointer;margin-top:6px;box-shadow:0 4px 14px rgba(184,146,58,.35);transition:all .2s}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(184,146,58,.45)}
.gbtn:active{transform:translateY(0)}
/* Secondary / ghost button */
.gbtn-ghost{background:transparent;color:var(--gold-d);border:1.5px solid var(--gold);border-radius:var(--r-sm);padding:12px 13px;font-size:12px;letter-spacing:.04em;font-weight:600;cursor:pointer;transition:all .2s}
.gbtn-ghost:hover{background:var(--gold-p);transform:translateY(-1px)}
.gbtn-ghost:active{transform:translateY(0)}
.aerr{background:#FFF1F2;border:1.5px solid #FECDD3;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:#BE123C;margin-bottom:16px;font-weight:500}

/* ── TOPBAR ── */
.tb{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border),var(--shadow-sm)}
.lm{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lm img{width:40px;height:40px;object-fit:contain;display:block}
.lt{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:-.1px}
.ls{font-size:10px;color:var(--mg);letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-top:1px}
.gbar{height:2px;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l),var(--gold))}

/* ── TABS ── */
.tabs{display:flex;gap:2px;background:var(--off);border-radius:var(--r-md);padding:4px}
.tab{padding:7px 14px;background:transparent;border:none;border-radius:var(--r-sm);font-size:11px;letter-spacing:.02em;color:var(--mg);font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
.tab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow-sm)}
.tab:hover:not(.on){background:rgba(255,255,255,.6);color:var(--mid)}
.tab[data-t="appointment"]:not(.on){border:1px solid rgba(184,146,58,.4);color:var(--gold-d);font-weight:600}
.tab[data-t="appointment"].on{background:var(--gold);color:#fff;border-color:var(--gold)}
.ua{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mg)}
.sob{background:none;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:6px 12px;font-size:11px;color:var(--mg);cursor:pointer;font-weight:500;transition:all .15s}
.sob:hover{border-color:var(--red);color:var(--red)}

/* ── PAGE ── */
.pg{max-width:1080px;margin:0 auto;padding:32px 28px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px}
.ptitle{font-size:28px;font-weight:700;color:var(--navy);letter-spacing:-.5px;font-family:var(--serif)}
.psub{font-size:13px;color:var(--mg);margin-top:4px;font-weight:400}

/* ── MONTH PICKER ── */
.mp{display:flex;align-items:center;gap:6px}
.mpb{background:#fff;border:1.5px solid var(--border);border-radius:var(--r-sm);width:30px;height:30px;color:var(--mid);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.mpb:hover{border-color:var(--gold);color:var(--gold)}
.mpl{font-size:13px;font-weight:600;color:var(--navy);min-width:130px;text-align:center;letter-spacing:-.1px}

/* ── SUMMARY CARDS ── */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
/* ── Budget grid view ── */
.bv-toggle{display:flex;gap:3px;background:var(--off);border-radius:var(--r-sm);padding:3px;flex-shrink:0}
.vbtn{background:none;border:none;border-radius:6px;width:30px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mg);transition:all .15s}
.vbtn.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.vbtn:hover{color:var(--gold)}
.vbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bcat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px}
.bcat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;transition:box-shadow .15s,border-color .15s}
.bcat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);border-color:rgba(184,146,58,.3)}
.bcat-card.over{border-color:rgba(220,38,38,.2);background:#FFFAFA}
.bcat-icon{width:32px;height:32px;border-radius:7px;background:var(--gold-p);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.bcat-icon svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bcat-card.over .bcat-icon{background:rgba(220,38,38,.08)}
.bcat-card.over .bcat-icon svg{stroke:#DC2626}
.bcat-name{font-size:10px;font-weight:700;color:var(--mg);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.bcat-amt{font-size:17px;font-weight:700;color:var(--navy);font-family:var(--serif);margin-bottom:8px;letter-spacing:-.3px}
.bcat-pb{height:4px;background:var(--off);border-radius:2px;overflow:hidden;margin-bottom:6px}
.bcat-pbf{height:100%;border-radius:2px}
.bcat-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mg);margin-bottom:2px}
.bcat-meta span:last-child{font-weight:600}
.sc{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.sc:hover{box-shadow:var(--shadow-md)}
.sc.pri{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-l) 100%);border:none;box-shadow:0 8px 28px rgba(10,22,40,.25)}
.scl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mg);font-weight:600;margin-bottom:8px}
.sc.pri .scl{color:rgba(255,255,255,.5)}
.scv{font-size:24px;font-weight:700;color:var(--dk);letter-spacing:-.5px}
.sc.pri .scv{color:var(--gold-l)}
.scs{font-size:12px;color:var(--mg);margin-top:4px}
.sc.pri .scs{color:rgba(255,255,255,.35)}

/* ── SECTIONS ── */
.sec{margin-bottom:16px;background:var(--card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
.sh{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--border-l);user-select:none;transition:background .15s}
.sh:hover{background:#FAFBFC}
.sh-chevron{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--off);transition:transform .2s,background .15s;flex-shrink:0}
.sh-chevron svg{width:12px;height:12px;stroke:var(--mg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.sh:hover .sh-chevron{background:#EEF0F4}
.sh:hover .sh-chevron svg{stroke:var(--navy)}
.sh-chevron.open{transform:rotate(180deg)}
.stitle{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--navy)}
.stots{display:flex;gap:20px;align-items:center;font-size:12px;color:var(--mg);flex-wrap:wrap}
.stots b{color:var(--navy);font-weight:600}
.ch{padding:8px 22px;display:grid;grid-template-columns:1fr 120px 120px 100px 28px;gap:10px;border-bottom:1px solid var(--border-l);background:#FAFBFC}
.ch span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mg);font-weight:600}
.br{padding:12px 22px;display:grid;grid-template-columns:1fr 120px 120px 100px 28px;gap:10px;align-items:center;border-bottom:1px solid var(--border-l);transition:background .12s}
.br:hover{background:#FAFBFC}
.bn{font-size:14px;color:var(--dk);font-weight:400}
.ni{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--dk);background:#FAFBFC;text-align:right;outline:none;transition:all .15s}
.ni:hover{border-color:#C0C8D8}
.ni:focus{border-color:var(--gold);background:#fff}
.pb{height:5px;background:var(--border-l);border-radius:10px;overflow:hidden;margin-top:4px}
.pbf{height:100%;border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.pcl{font-size:10px;color:var(--mg);margin-top:3px;font-weight:500}
.addb{background:none;border:none;color:var(--gold);font-size:12px;padding:11px 22px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;transition:opacity .15s}
.addb:hover{opacity:.7}
.db{background:none;border:none;color:#C8CDD8;font-size:18px;line-height:1;cursor:pointer;padding:2px;transition:color .15s;border-radius:4px}
.db:hover{color:var(--red)}

/* ── EXPENSE MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(10,22,40,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200}
.md{background:#fff;border-radius:var(--r-xl);padding:32px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mt{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
.cb{background:none;border:none;font-size:22px;color:var(--mg);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
.cb:hover{background:var(--off)}
.fin{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--dk);background:#fff;outline:none;transition:all .2s}
.fin:hover{border-color:#C0C8D8}
.fse{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--dk);background:#fff;outline:none;transition:all .2s}

/* ── TRANSACTIONS ── */
.tr{padding:14px 22px;display:grid;grid-template-columns:100px 1fr 130px 110px 28px;gap:10px;align-items:center;border-bottom:1px solid var(--border-l);transition:background .12s}
.tr:hover{background:#FAFBFC}
.tdt{font-size:11px;color:var(--mg);font-weight:500}
.tn{font-size:14px;color:var(--dk);font-weight:500}
.tnote{font-size:11px;color:var(--mg)}
.cbadge{font-size:10px;background:var(--gold-p);color:var(--gold-d);padding:4px 10px;border-radius:20px;text-align:center;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.tamt{font-size:15px;font-weight:700;text-align:right;color:var(--dk)}

/* ── HISTORY ── */
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.hc:hover{box-shadow:var(--shadow-md);border-color:var(--gold-l);transform:translateY(-2px)}

/* ── IFRAME (Book Advisor) ── */
.iframe-wrap{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.iframe-wrap iframe{width:100%;border:none;display:block;min-height:880px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:var(--r-md);font-size:13px;font-weight:500;z-index:999;border-left:3px solid var(--gold);display:none;box-shadow:var(--shadow-lg);animation:toastIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){
  .toast{bottom:calc(68px + max(8px,env(safe-area-inset-bottom)));right:12px;left:12px;text-align:center;}
}

/* ── EMPTY STATE ── */
.empty{padding:48px 36px;text-align:center;color:var(--mg);font-size:14px}

/* ── SKELETON LOADING ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{background:linear-gradient(90deg,#F0F2F5 25%,#E4E8EE 50%,#F0F2F5 75%);background-size:800px 100%;animation:shimmer 1.4s infinite;border-radius:6px}
.skel-card{height:88px;border-radius:var(--r-lg);margin-bottom:0}
.skel-row{height:44px;border-radius:4px;margin-bottom:4px}
.skel-title{height:24px;width:40%;border-radius:4px;margin-bottom:8px}
.skel-sub{height:14px;width:60%;border-radius:4px}
html.dark .skel{background:linear-gradient(90deg,#1A2336 25%,#243252 50%,#1A2336 75%);background-size:800px 100%;}

/* ── ADVISOR DASHBOARD ── */
.adv-wrap{min-height:100vh;background:var(--navy);font-family:var(--sans)}
.adv-bar{background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:46px}
.adv-bar-left{display:flex;align-items:center;gap:14px}
.adv-badge{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 100%);color:#fff;font-size:9px;letter-spacing:.12em;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.adv-title{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.2px}
.adv-sub{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.adv-pg{max-width:1160px;margin:0 auto;padding:36px 32px}
.adv-hero{margin-bottom:32px}
.adv-hero-title{font-size:clamp(14px,4vw,20px);font-weight:700;color:#fff;letter-spacing:-.3px;font-family:var(--serif);margin-bottom:3px}
.adv-hero-sub{font-size:14px;color:rgba(255,255,255,.4)}
.adv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.adv-stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-lg);padding:20px 22px;transition:background .2s}
.adv-stat:hover{background:rgba(255,255,255,.08)}
.adv-stat-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px;font-weight:600}
.adv-stat-v{font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px}
.adv-stat-s{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px}
.adv-stat.gold .adv-stat-v{color:var(--gold-l)}
.adv-stat.red .adv-stat-v{color:#F87171}
.adv-stat.green .adv-stat-v{color:#4ADE80}
.adv-stat.amber .adv-stat-v{color:#FBB347}
.adv-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.adv-filter-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);padding:6px 14px;font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;font-weight:500;transition:all .15s;letter-spacing:.02em}
.adv-filter-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.adv-filter-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
.adv-search{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);padding:7px 14px;font-size:12px;color:#fff;outline:none;width:220px;margin-left:auto}
.adv-search::placeholder{color:rgba(255,255,255,.25)}
.adv-search:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
.adv-table{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);overflow:hidden}
.adv-th{display:grid;grid-template-columns:2fr 110px 110px 110px 110px 130px 90px;gap:10px;padding:12px 22px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07)}
.adv-th span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:600}
.adv-row{display:grid;grid-template-columns:2fr 110px 110px 110px 110px 130px 90px;gap:10px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;transition:background .12s;cursor:pointer}
.adv-row:hover{background:rgba(255,255,255,.04)}
.adv-row:last-child{border-bottom:none}
.adv-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.1px}
.adv-email{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.adv-pill{display:inline-block;font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.adv-pill.high{background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.2)}
.adv-pill.mod{background:rgba(251,146,60,.12);color:#FBB347;border:1px solid rgba(251,146,60,.18)}
.adv-pill.low{background:rgba(74,222,128,.1);color:#4ADE80;border:1px solid rgba(74,222,128,.15)}
.adv-pill.none{background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.08)}
.adv-gap-val{font-size:14px;font-weight:600;color:#fff}
.adv-activity{font-size:12px;font-weight:500}
.adv-activity.urgent{color:#F87171}
.adv-activity.warn{color:#FBB347}
.adv-activity.ok{color:rgba(255,255,255,.4)}
.adv-urgency-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
.adv-urgency-dot.red{background:#F87171;box-shadow:0 0 6px rgba(248,113,113,.5)}
.adv-urgency-dot.amber{background:#FBB347;box-shadow:0 0 6px rgba(251,179,71,.4)}
.adv-urgency-dot.green{background:#4ADE80;box-shadow:0 0 6px rgba(74,222,128,.3)}
.adv-urgency-dot.grey{background:rgba(255,255,255,.2)}
.adv-empty{padding:64px 32px;text-align:center;color:rgba(255,255,255,.2);font-size:14px}
.adv-loading{padding:64px 32px;text-align:center;color:rgba(255,255,255,.3);font-size:13px}
.adv-modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.adv-modal{background:var(--navy-l);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-xl);padding:36px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.adv-modal-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.adv-modal-name{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.3px}
.adv-modal-email{font-size:12px;color:rgba(255,255,255,.3);margin-top:3px}
.adv-modal-close{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.5);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.adv-modal-close:hover{background:rgba(255,255,255,.14);color:#fff}
.adv-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.adv-modal-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-md);padding:14px 16px}
.adv-modal-card-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px;font-weight:600}
.adv-modal-card-v{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px}
.adv-modal-card-v.gold{color:var(--gold-l)}
.adv-modal-card-v.red{color:#F87171}
.adv-modal-card-v.green{color:#4ADE80}
.adv-modal-section{margin-bottom:18px}
.adv-modal-section-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.25);font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06)}
.adv-modal-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.adv-modal-row-l{font-size:12px;color:rgba(255,255,255,.4)}
.adv-modal-row-v{font-size:13px;font-weight:600;color:#fff}
.adv-action-btn{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 100%);border:none;color:#fff;border-radius:var(--r-sm);padding:11px 20px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:all .15s;width:100%;margin-top:6px}
.adv-action-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(184,146,58,.4)}
.adv-action-btn.ghost{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);box-shadow:none}
.adv-action-btn.ghost:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}

/* ══════════════════════════════════════════════════════════
   MOBILE-FIRST PWA, clean layout
   ══════════════════════════════════════════════════════════ */

/* ── Bottom Navigation Bar ── */
.mob-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;
  border-top:1px solid #EAECF0;
  padding:0 0 max(8px,env(safe-area-inset-bottom));
  box-shadow:0 -1px 0 rgba(0,0,0,.06),0 -6px 20px rgba(0,0,0,.05);
}
.mob-nav-inner{
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.mob-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  padding:10px 2px 6px;
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  color:#9AA5B4;
  transition:color .18s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  min-width:0;
}
.mob-tab.on{color:var(--gold);}
.mob-tab.on::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:2px;background:var(--gold);border-radius:0 0 3px 3px;
}
.mob-tab svg{
  width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;
}
.mob-tab span{
  font-size:9.5px;font-weight:500;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:60px;line-height:1;
}

/* ── More Menu Sheet ── */
.mob-more-sheet{display:none;position:fixed;inset:0;z-index:200;}
.mob-more-sheet.open{display:block;}
.mob-more-overlay{position:absolute;inset:0;background:rgba(10,22,40,.45);backdrop-filter:blur(3px);}
.mob-more-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:#fff;border-radius:22px 22px 0 0;
  padding:0 0 max(24px,env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,.18);
  animation:slideUp .22s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mob-more-handle{
  width:36px;height:4px;background:#D0D5DD;border-radius:2px;
  margin:14px auto 18px;
}
.mob-more-title{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mg);font-weight:600;padding:0 20px 12px;
  border-bottom:1px solid var(--border-l);margin-bottom:12px;
}
.mob-more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 4px;}
.mob-more-item{
  display:flex;align-items:center;gap:10px;
  padding:13px 12px;background:#F9FAFB;border-radius:12px;
  border:1px solid transparent;cursor:pointer;font-family:var(--sans);
  text-align:left;-webkit-tap-highlight-color:transparent;transition:all .15s;
}
.mob-more-item:active{background:var(--gold-p);transform:scale(.97);}
.mob-more-item svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.mob-more-item span{font-size:12px;font-weight:500;color:var(--navy);line-height:1.2;}
.mob-more-item.on span{color:var(--gold-d);}
.mob-more-item.on{background:var(--gold-p);border-color:rgba(184,146,58,.25);}

/* ── PWA Install Banner ── */
#gwb-banner, #gwb-ios{
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}

/* ════════════════════════════════
   MOBILE  ≤ 768px
   ════════════════════════════════ */
@media(max-width:768px){
  .tabs{display:none!important}
  .mob-nav{display:block}

  /* Topbar */
  .tb{padding:0 14px;height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);}
  .tb .ua{display:none}
  .lt{font-size:13px;font-weight:700;}
  .ls{display:block;font-size:8px;letter-spacing:.08em;margin-top:0;}
  .lm img{width:28px;height:28px;}

  /* Page titles — switch to clean sans on mobile, boost size */
  .ptitle{font-family:var(--sans)!important;font-size:18px!important;font-weight:700!important;letter-spacing:-.3px!important;}

  /* Page */
  .pg{padding:12px 10px 84px;max-width:100%;}

  /* Page header */
  .ph{margin-bottom:12px;flex-direction:column;gap:6px;align-items:flex-start;}
  .ptitle{font-size:16px!important;letter-spacing:-.1px;}
  .psub{font-size:11px;line-height:1.4;}
  .ph > div:last-child{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;}

  /* Stat cards */
  .sg{grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
  .bcat-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .sg .sc:last-child{grid-column:span 2;}
  .sc{padding:12px 11px;border-radius:9px;}
  .scl{font-size:9px;letter-spacing:.04em;margin-bottom:4px;}
  .scv{font-size:18px!important;letter-spacing:-.3px;line-height:1.2;}
  .scs{font-size:10px;line-height:1.3;margin-top:3px;}

  /* Sections */
  .sec{border-radius:9px;margin-bottom:7px;}
  .sh{padding:10px 11px;flex-wrap:wrap;gap:4px;}
  .stitle{font-size:9.5px;letter-spacing:.05em;}
  .stots{gap:5px;font-size:9.5px;flex-wrap:wrap;max-width:55%;text-align:right;}
  .stots b{font-size:10px;}

  /* Budget header */
  .ch{padding:5px 11px;grid-template-columns:1fr 76px 22px;gap:5px;}
  .ch span{font-size:8.5px;}
  .ch span:nth-child(3),.ch span:nth-child(4),
  .br>div:nth-child(3),.br>div:nth-child(4){display:none!important;}

  /* Budget rows */
  .br{padding:8px 11px;grid-template-columns:1fr 76px 22px;gap:5px;}
  .bn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 130px);}
  .ni{font-size:12.5px;padding:6px 6px;text-align:right;}
  .addb{padding:9px 11px;font-size:11.5px;}
  .db{font-size:14px;width:22px;height:22px;}

  /* Transaction rows */
  .tr{grid-template-columns:1fr auto 22px;gap:5px;padding:9px 11px;align-items:center;}
  .tr .tdt,.tr .cbadge{display:none!important;}
  .tn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tnote{font-size:9.5px;margin-top:1px;}
  .tamt{font-size:12.5px;font-weight:700;white-space:nowrap;}

  /* Modal */
  .mbg{align-items:flex-end;padding:0;}
  .md{border-radius:18px 18px 0 0;padding:18px 14px;padding-bottom:max(22px,env(safe-area-inset-bottom));max-height:90vh;width:100%;max-width:100%;}
  .mt{font-size:14px;}
  .fin,.fse{font-size:12.5px;padding:8px 10px;}
  .lbl{font-size:10px;}
  .gbtn{font-size:11px;padding:10px;}

  /* History */
  .hg{grid-template-columns:1fr 1fr;gap:7px;}
  .hc{padding:11px;}

  /* Auth */
  .aw{padding:16px;align-items:center;justify-content:center;}
  .ac{padding:24px 18px;border-radius:16px;max-width:100%;width:100%;}
  .alogo img{width:48px;height:48px;}
  .atitle{font-size:16px;}
  .ain{font-size:12.5px;padding:9px 11px;}
  .alogo-s{font-size:8.5px;}
  .alogo-p{font-size:9px;}

  /* Month picker */
  .mp{gap:3px;}
  .mpl{min-width:82px;font-size:11px;}
  .mpb{width:24px;height:24px;font-size:12px;}

  /* Advisor */
  .adv-bar{padding:0 12px;padding-top:env(safe-area-inset-top);}
  .adv-th{display:none;}
  .adv-row{grid-template-columns:1fr auto;gap:5px;padding:10px 11px;}
  .adv-row>div:nth-child(3),.adv-row>div:nth-child(4),.adv-row>div:nth-child(5){display:none!important;}
  .adv-name{font-size:12.5px;}
  .adv-email{font-size:9.5px;}
  .adv-pill{font-size:9px;padding:3px 8px;}
  .adv-stats{grid-template-columns:1fr 1fr;gap:7px;}
  .adv-stat{padding:10px 11px;}
  .adv-stat-l{font-size:8px;}
  .adv-stat-v{font-size:14px!important;}
  .adv-stat-s{font-size:9.5px;}
  .adv-pg{padding:12px 10px 84px;}
  .adv-filters{gap:4px;flex-wrap:wrap;}
  .adv-filter-btn{font-size:10px;padding:4px 9px;}
  .adv-search{width:100%;margin-left:0;margin-top:4px;font-size:11.5px;}
  .adv-modal{border-radius:18px 18px 0 0;max-width:100%;padding:20px 14px;padding-bottom:max(20px,env(safe-area-inset-bottom));}
  .adv-modal-bg{align-items:flex-end;padding:0;}
  .adv-modal-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .adv-modal-name{font-size:14px;}
  .adv-modal-card-v{font-size:13px;}
  .adv-modal-card-l{font-size:8px;}
  .adv-modal-row-l{font-size:11px;}
  .adv-modal-row-v{font-size:12px;}
  .adv-hero-title{font-size:16px!important;}
  .adv-hero-sub{font-size:11px;}
  .adv-sub{display:none;}
  .adv-badge{font-size:7.5px;padding:2px 6px;}
  .adv-title{font-size:12px;}
  .adv-gap-val{font-size:11.5px;}
  .adv-activity{font-size:11px;}
}

/* ═══════════════════════
   TINY  ≤ 390px
   ═══════════════════════ */
@media(max-width:390px){
  .pg{padding:10px 8px 82px;}
  .sg{grid-template-columns:1fr;}
  .sg .sc:last-child{grid-column:span 1;}
  .hg{grid-template-columns:1fr;}
  .mob-more-grid{grid-template-columns:1fr;}
  .ptitle{font-size:15px!important;}
  .scv{font-size:12px!important;}
  .scs{font-size:9px;}
  .mob-tab span{font-size:7.5px;}
  .mob-tab svg{width:19px;height:19px;}
  .adv-stats{grid-template-columns:1fr;}
  .adv-stat-v{font-size:13px!important;}
  .bn{max-width:calc(100vw - 110px);}
}

/* ═══════════════════════════════════
   INLINE STYLE OVERRIDES (mobile)
   ═══════════════════════════════════ */
@media(max-width:768px){
  /* All big inline numbers inside .pg and .adv-pg */
  .pg [style*="font-size:32px"],.adv-pg [style*="font-size:32px"]{font-size:14px!important;}
  .pg [style*="font-size:40px"],.adv-pg [style*="font-size:40px"]{font-size:16px!important;}
  .pg [style*="font-size:28px"],.adv-pg [style*="font-size:28px"]{font-size:13px!important;}
  .pg [style*="font-size:26px"],.adv-pg [style*="font-size:26px"]{font-size:13px!important;}
  .pg [style*="font-size:24px"],.adv-pg [style*="font-size:24px"]{font-size:13px!important;}
  .pg [style*="font-size:22px"],.adv-pg [style*="font-size:22px"]{font-size:13px!important;}
  .pg [style*="font-size:20px"],.adv-pg [style*="font-size:20px"]{font-size:12.5px!important;}
  .pg [style*="font-size:18px"],.adv-pg [style*="font-size:18px"]{font-size:12px!important;}
  .pg [style*="font-size:16px;font-weight:700"],.adv-pg [style*="font-size:16px;font-weight:700"]{font-size:12px!important;}
  .pg [style*="font-size:15px;font-weight:700"],.adv-pg [style*="font-size:15px;font-weight:700"]{font-size:12px!important;}

  /* Inline paddings, compress sections */
  .pg [style*="padding:24px"],.adv-pg [style*="padding:24px"]{padding:12px!important;}
  .pg [style*="padding:20px"],.adv-pg [style*="padding:20px"]{padding:11px!important;}
  .pg [style*="padding:18px 20px"],.adv-pg [style*="padding:18px 20px"]{padding:10px 11px!important;}
  .pg [style*="padding:16px 20px"],.adv-pg [style*="padding:16px 20px"]{padding:9px 11px!important;}

  /* Multi-col inline grids → 2-col */
  .loan-stats-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;}
  .inputs-3col{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;}

  /* History card amounts */
  .hc [style*="font-size"]{font-size:12px!important;}

  /* Report */
  #print-report .sg{grid-template-columns:1fr!important;}

  /* Recurring rows */
  .rec-row{flex-wrap:wrap!important;gap:6px!important;}
}
/* ══════════════════════════════════
   LANDSCAPE MODE
   ══════════════════════════════════ */
@media (orientation: landscape) and (max-height: 500px) {
  /* Auth screen, side by side layout */
  .aw { align-items: flex-start; padding: 10px 16px; }
  .ac { padding: 16px 20px; display: flex; flex-direction: row;
        align-items: center; gap: 24px; max-width: 700px; }
  .alogo { margin-bottom: 0; flex-shrink: 0; }
  .alogo img { width: 48px; height: 48px; }
  .alogo-s, .alogo-p, .adiv { display: none; }
  .atitle { font-size: 16px; margin-bottom: 12px; }
  .fld { margin-bottom: 10px; }
  .ain { padding: 8px 12px; font-size: 13px; }
  .gbtn { padding: 10px; margin-top: 4px; }

  /* Page, reduce padding, allow scroll */
  .pg { padding: 8px 10px 70px; }
  .adv-pg { padding: 8px 10px 70px; }

  /* Summary cards, single row in landscape */
  .sg { grid-template-columns: repeat(3,1fr) !important; gap: 8px; }
  .sg .sc:last-child { grid-column: span 1 !important; }
  .sc { padding: 8px 10px; }
  .scv { font-size: 14px !important; }
  .scl { font-size: 8px; }

  /* Page header */
  .ph { margin-bottom: 8px; }
  .ptitle { font-size: 15px !important; }

  /* Bottom nav, stays at bottom, compact */
  .mob-nav { height: 48px; }
  .mob-tab svg { width: 18px; height: 18px; }
  .mob-tab span { font-size: 8px; }

  /* Sections */
  .sec { margin-bottom: 6px; }
  .sh { padding: 8px 12px; }

  /* Advisor stats */
  .adv-stats { grid-template-columns: repeat(4,1fr) !important; }
}

/* ── DARK MODE (class-based — toggled by user, light is default) ── */
/* Dark toggle button */
.dm-btn{background:none;border:1.5px solid var(--border);border-radius:var(--r-sm);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;color:var(--mg)}
.dm-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-p)}
.dm-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
html.dark .dm-btn{border-color:#2D3748;background:#111827;color:#A0AEC0}
html.dark .dm-btn:hover{border-color:var(--gold-l);color:var(--gold-l);background:#1A2336}

html.dark{
  --off:#111827;--card:#1A2336;--border:#2D3748;--border-l:#232E42;
  --mg:#8896AA;--dk:#F0F4F8;--mid:#A0AEC0;
  --navy:#0D1F3C;--navy-l:#152A4E;--navy-2:#1A3360;
}
html.dark,html.dark body{background:#0F172A;color:#F0F4F8}
html.dark #app{background:#0F172A}
/* Cards and surfaces */
html.dark .sc{background:#1A2336;border-color:#2D3748}
html.dark .sec{background:#1A2336;border-color:#2D3748}
html.dark .sh{border-bottom-color:#232E42}
html.dark .sh:hover{background:#1E2A3E}
html.dark .md{background:#1A2336}
html.dark .hc{background:#1A2336;border-color:#2D3748}
html.dark .hc:hover{border-color:var(--gold-l)}
/* Topbar */
html.dark .tb{background:rgba(15,23,42,.92);border-bottom-color:#2D3748}
/* Inputs */
html.dark .ain,html.dark .fin,html.dark .fse,html.dark .ni{background:#111827;border-color:#2D3748;color:#F0F4F8}
html.dark .ain:hover,html.dark .fin:hover,html.dark .fse:hover,html.dark .ni:hover{border-color:#3D4F6A}
/* Month picker */
html.dark .mpb{background:#1A2336;border-color:#2D3748;color:#A0AEC0}
html.dark .mpl{color:#F0F4F8}
html.dark .bv-toggle{background:#111827}
html.dark .vbtn.on{background:#1A2336;color:#F0F4F8;box-shadow:0 1px 3px rgba(0,0,0,.3)}
html.dark .bcat-card{background:#1A2336;border-color:#2D3748}
html.dark .bcat-card.over{background:rgba(220,38,38,.05);border-color:rgba(220,38,38,.3)}
html.dark .bcat-icon{background:rgba(184,146,58,.15)}
html.dark .bcat-card.over .bcat-icon{background:rgba(220,38,38,.12)}
html.dark .bcat-amt{color:#F0F4F8}
html.dark .bcat-pb{background:#111827}
/* Tab bar */
html.dark .tabs{background:#111827}
html.dark .tab{color:#8896AA}
html.dark .tab.on{background:#1A2336;color:#F0F4F8}
html.dark .tab:hover:not(.on){background:rgba(255,255,255,.05);color:#CBD5E1}
/* Bottom nav */
html.dark .mob-nav{background:#0F172A;border-top-color:#2D3748}
html.dark .mob-more-panel{background:#111827;border-color:#2D3748}
html.dark .mob-more-title{color:#F0F4F8}
html.dark .mob-more-item{background:#1A2336;border-color:#2D3748}
html.dark .mob-more-item span{color:#E2E8F0}
html.dark .mob-more-item svg{stroke:#B8923A}
html.dark .mob-more-item:active{background:#233152}
html.dark .tab[data-t="appointment"]:not(.on){border-color:rgba(184,146,58,.3);color:var(--gold-l)}
/* Auth page */
html.dark .ac{background:rgba(15,23,42,.97)}
/* Budget section headers text */
html.dark .stitle{color:#E2E8F0}
html.dark .stots{color:#8896AA}
html.dark .stots b{color:#E2E8F0 !important}
html.dark .ch{background:#131F32}
html.dark .ch span{color:#8896AA}
/* Budget rows */
html.dark .bn{color:#F0F4F8}
html.dark .br{border-bottom-color:#1E2A3E}
html.dark .br:hover,html.dark .tr:hover{background:#1E2A3E}
/* Progress bar track */
html.dark .pb{background:#2D3748}
/* Badges */
html.dark .cbadge{background:#233152;color:var(--gold-l)}
/* Scrollbar */
html.dark ::-webkit-scrollbar-thumb{background:#2D3748}
/* Generic selects */
html.dark select{background:#111827 !important;border-color:#2D3748 !important;color:#F0F4F8 !important}
/* Sign out btn */
html.dark .sob{border-color:#2D3748;color:#8896AA}
html.dark .sob:hover{border-color:var(--red);color:var(--red)}
/* Ghost button */
html.dark .gbtn-ghost{border-color:var(--gold);color:var(--gold-l)}
html.dark .gbtn-ghost:hover{background:#1A2336}
/* Tracker rows */
html.dark .tn,html.dark .td{color:#E2E8F0}
html.dark .ts{color:#8896AA}
/* Page titles */
html.dark .ptitle{color:#F0F4F8 !important}
html.dark .psub{color:#8896AA}
html.dark .lt{color:#F0F4F8}
html.dark .ls{color:#8896AA}
/* Stat card values */
html.dark .scv{color:var(--gold-l)}
html.dark .scl{color:#8896AA}
/* Labels */
html.dark label,html.dark .fl{color:#CBD5E1}
/* Saving indicator */
html.dark #saving-ind{color:var(--gold-l)}

/* ── Inline-style overrides via attribute selectors ── */
/* Text using var(--navy) → light in dark mode */
html.dark [style*="color:var(--navy)"]{color:#E2E8F0 !important}
/* Text using var(--dk) → ensure it stays light */
html.dark [style*="color:var(--dk)"]{color:#F0F4F8 !important}
/* Hardcoded white/cream backgrounds → dark surfaces */
html.dark [style*="background:#fff"]{background:#111827 !important;color:#F0F4F8 !important}
html.dark [style*="background:#FAFAF8"]{background:#1A2336 !important;border-color:#2D3748 !important}
html.dark [style*="background:#FAFAF6"]{background:#1A2336 !important}
html.dark [style*="background:#F0FDF4"]{background:rgba(22,163,74,.1) !important}
html.dark [style*="background:#FEF2F2"]{background:rgba(220,38,38,.1) !important}
/* Hardcoded light borders in retirement breakdown rows */
html.dark [style*="border-bottom:1px solid #F5F3EE"]{border-bottom-color:#2D3748 !important}
html.dark [style*="border:1px solid #E8E5DC"]{border-color:#2D3748 !important}
html.dark [style*="border:1px solid #BBF7D0"]{border-color:rgba(74,222,128,.3) !important}
html.dark [style*="border:1px solid #FECACA"]{border-color:rgba(248,113,113,.3) !important}
/* Status banner text colours */
html.dark [style*="color:#166534"]{color:#4ADE80 !important}
html.dark [style*="color:#991B1B"]{color:#F87171 !important}
html.dark [style*="color:#15803D"]{color:#86EFAC !important}
/* History card inline text */
html.dark [style*="color:var(--mid)"]{color:#A0AEC0 !important}

/* ── Confirm / Input modals ── */
.cfrm-overlay,.inm-overlay{position:fixed;inset:0;background:rgba(10,22,40,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.cfrm-box,.inm-box{background:#fff;border-radius:var(--r-xl);padding:28px;width:100%;max-width:340px;box-shadow:var(--shadow-lg)}
.cfrm-msg{font-size:15px;color:var(--navy);font-weight:500;margin-bottom:22px;line-height:1.5;text-align:center}
.inm-title{font-size:15px;color:var(--navy);font-weight:600;margin-bottom:14px}
.inm-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--dk);margin-bottom:16px;outline:none;transition:all .2s;font-family:var(--sans);background:#fff}
.inm-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,146,58,.12)}
.cfrm-btns,.inm-btns{display:flex;gap:10px;justify-content:flex-end}
.cfrm-btn{padding:9px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.cfrm-no{background:var(--off);color:var(--mid)}
.cfrm-no:hover{background:#E8EAF0}
.cfrm-yes{background:var(--red);color:#fff}
.cfrm-yes:hover{background:#C41E2E;transform:translateY(-1px)}
.inm-btns .cfrm-yes{background:var(--gold);color:#fff}
.inm-btns .cfrm-yes:hover{background:var(--gold-d);transform:translateY(-1px)}
/* ── Offline banner ── */
.offline-bar{position:fixed;top:0;left:0;right:0;z-index:500;background:#92400E;color:#fff;text-align:center;font-size:13px;font-weight:500;padding:10px 20px;animation:toastIn .3s ease}
.offline-bar[hidden]{display:none!important}
/* Dark mode for confirm/input modals */
html.dark .cfrm-box,html.dark .inm-box{background:#1A2336;border:1px solid #2D3748}
html.dark .cfrm-msg{color:#F0F4F8}
html.dark .inm-title{color:#F0F4F8}
html.dark .inm-input{background:#111827;border-color:#2D3748;color:#F0F4F8}
html.dark .cfrm-no{background:#111827;color:#A0AEC0}
html.dark .cfrm-no:hover{background:#1A2336}

</style>

const CURRENCIES = {
  BWP: {symbol:'P',  name:'Botswana Pula',   locale:'en-BW', rate:1},
  ZAR: {symbol:'R',  name:'South African Rand', locale:'en-ZA', rate:1},
  USD: {symbol:'$',  name:'US Dollar',        locale:'en-US', rate:1},

// Static fallback rates (BWP base) — updated periodically
const FALLBACK_RATES = {
  BWP:1, ZAR:1.26, USD:0.073, GBP:0.057,
  EUR:0.067, ZMW:1.94, ZWL:26.5, NAD:1.26
};

window.FX = window.FX || {
  currency: 'BWP',
  rate: 1,          // how many selected currency = 1 BWP
  lastFetched: null,
  ratesMap: {...FALLBACK_RATES}
};

window.fxSave = async function(){
  if(!S.user) return;
  await sb.from('user_tools').upsert(
    {user_id:S.user.id, tool:'fx', data:{currency:FX.currency,ratesMap:FX.ratesMap}, updated_at:new Date().toISOString()},
    {onConflict:'user_id,tool'}
  );
};

async function loadFX(){
  if(!S.user) return;
  const {data} = await sb.from('user_tools').select('data')
    .eq('user_id',S.user.id).eq('tool','fx').single();
  if(data?.data){
    FX.currency = data.data.currency || 'BWP';
    if(data.data.ratesMap) FX.ratesMap = {...FALLBACK_RATES,...data.data.ratesMap};
  }
  FX.rate = FX.ratesMap[FX.currency]||1;
  // Try to fetch live rates (silently falls back if fails)
  fetchLiveRates();
}

async function fetchLiveRates(){
  // Skip if rates were fetched within the last hour
  if(FX.lastFetched && (Date.now()-new Date(FX.lastFetched).getTime()) < 3600000) return;
  try{
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/BWP');
    if(!res.ok) return;
    const data = await res.json();
    if(data.rates){
      Object.keys(FALLBACK_RATES).forEach(c=>{
        if(data.rates[c]) FX.ratesMap[c] = data.rates[c];
      });
      FX.rate = FX.ratesMap[FX.currency]||1;
      FX.lastFetched = new Date().toISOString();
      fxSave();
      render();
    }
  }catch(e){ /* use fallback rates silently */ }
}

window.setCurrency = function(code){
  FX.currency = code;
  FX.rate = FX.ratesMap[code]||1;
  fxSave();

};

// Convert BWP amount → selected currency
function toFX(bwp){ return (bwp||0) * FX.rate; }
// Convert selected currency → BWP (for input values stored in native currency)
function fromFX(val){ return (val||0) / (FX.rate||1); }

function fmt(n){
  const c = CURRENCIES[FX.currency]||CURRENCIES.BWP;
  const v = toFX(n||0);
  return c.symbol+' '+v.toLocaleString(c.locale,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pct(s,b){return(!b||b===0)?0:Math.min(100,Math.round((s/b)*100));}
function mk(){return S.year+'-'+String(S.month+1).padStart(2,'0');}

// ── SPENDING ALERTS ────────────────────────────────────────────
function checkSpendingAlerts(){
  if(!S.bd||!S.tx||!S.user) return;
  const shown=JSON.parse(sessionStorage.getItem('sp_alerted')||'{}');
  let changed=false;
  const cats=Object.keys(S.bd).filter(k=>k!=='income');
  cats.forEach(cat=>{
    const items=S.bd[cat]||[];
    const budgeted=items.reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);
    if(!budgeted) return;
    const spent=spCat(cat);
    const p=pct(spent,budgeted);
    const key=mk()+'_'+cat;
    if(p>=100&&shown[key]!=='over'){
      setTimeout(()=>toast('⚠ '+CL[cat]+' is over budget!'),400);
      shown[key]='over';changed=true;
    } else if(p>=80&&!shown[key]){
      setTimeout(()=>toast(CL[cat]+' is at '+p+'% of budget'),400);
      shown[key]='warn';changed=true;
    }
  });
  if(changed) sessionStorage.setItem('sp_alerted',JSON.stringify(shown));
}

async function carryForward(){

  let prevYear  = S.year;
  if(prevMonth < 0){ prevMonth = 11; prevYear--; }
  const prevKey = prevYear + '-' + String(prevMonth+1).padStart(2,'0');
  const {data} = await sb.from('budgets').select('categories').eq('user_id',S.user.id).eq('month_key',prevKey).single();

  toast('Last month\'s budget copied ✓');
  render();

// ── CROSS-TAB SYNC FUNCTIONS ──────────────────────────────────────

// Connection 1: Loan Tracker → Budget
// Syncs LT loans into budget 'loans' category as line items
function syncLoansToBudget(){
  if(!S.bd) return;
  // Build loan repayment items from LT
  const loanItems = (LT.loans||[]).map(l=>({
    name: l.name,
    budgeted: l.monthlyPayment||0
  }));
  S.bd.loans = loanItems;
  // Save budget silently
  if(S.user && loanItems.length >= 0){
    sb.from('budgets').upsert(
      {user_id:S.user.id, month_key:mk(), categories:S.bd, updated_at:new Date().toISOString()},
      {onConflict:'user_id,month_key'}
    );
  }
}

// Connection 2: Expense logged → reduce loan balance
// If the logged expense category is 'loans', find matching loan and reduce balance
function applyPaymentToLoan(itemName, amount){
  if(!LT.loans||!LT.loans.length) return;
  const loan = LT.loans.find(l=>l.name.toLowerCase()===itemName.toLowerCase());
  if(loan){
    loan.balance = Math.max(0, loan.balance - amount);
    ltSave();
    // Also update GC.debts to reflect new total
    GC.debts = LT.loans.reduce((s,l)=>s+l.balance, 0);
    gcSave();
  } else {
    toast('Loan "'+itemName+'" not found in Loan Tracker. Balance not updated');
  }
}

// Connection 3: Loan Tracker → Wealth Gap (auto-populate debts)
// Called whenever loans change
function syncLoansToGap(){
  const totalDebt = (LT.loans||[]).reduce((s,l)=>s+l.balance, 0);
  GC.debts = totalDebt;
  gcSave();
}

// Connection 4: Budget savings → Goals progress
// Called whenever budget is saved — updates each goal's auto-contribution
function syncSavingsToGoals(){
  if(!S.bd||!SG.goals||!SG.goals.length) return;
  const monthlySavings = (S.bd.savings||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);
  if(monthlySavings <= 0) return;
  // Distribute savings proportionally across goals that have auto-contribution enabled
  const autoGoals = SG.goals.filter(g=>g.autoContribute);
  if(!autoGoals.length) return;
  const share = monthlySavings / autoGoals.length;
  autoGoals.forEach(g=>{
    g.saved = Math.min(g.target, (g.saved||0) + share);
  });
  sgSave();
}

function renderGap(){
  const T = tots();
  const bd = S.bd||{};
  const monthlyIncome  = T.inc;
  const annualIncome   = monthlyIncome*12;
  const monthlyExp = ['housing','transport','food','personal','lifestyle','giving']
    .reduce((s,k)=>s+(bd[k]||[]).reduce((a,i)=>a+(parseFloat(i.budgeted)||0),0),0);
  const monthlySavings = (bd.savings||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);

  const savingsTotal  = GC.savings||0;
  const debtsTotal    = GC.debts||0;
  const coverExisting = GC.cover||0;
  const yearsNeeded   = GC.years||10;

  const incomeNeeded = monthlyExp*12*yearsNeeded;
  const totalNeed    = incomeNeeded + debtsTotal;
  const totalHave    = savingsTotal + coverExisting;
  const gap          = Math.max(0, totalNeed - totalHave);
  const coveredPct   = totalNeed>0 ? Math.min(100,Math.round((totalHave/totalNeed)*100)) : 100;
  const runway       = monthlyExp>0 ? Math.round(savingsTotal/monthlyExp) : 0;

  let riskScore = 0;
  if(monthlyIncome>0){

    riskScore = Math.min(100,Math.round(
      (1-Math.min(1,coverRatio/5))*40 +

function calcLoan(balance, annualRate, monthlyPayment){
  if(balance<=0||monthlyPayment<=0) return {months:0,totalInterest:0,rows:[]};
  const mRate = annualRate/100/12;
  let rem = balance, totalInterest=0;
  const rows=[];
  let month=0;
  while(rem>0.01 && month<600){
    month++;
    const interest = rem*mRate;
    if(monthlyPayment<=interest) break;
    const principal = Math.min(monthlyPayment-interest, rem);
    rem = Math.max(0, rem-principal);
    totalInterest += interest;
    rows.push({month, payment:principal+interest, principal, interest, remaining:rem});
  }
  return {months:month, totalInterest, rows};
}

function ltPayoffDate(months){
  const d=new Date();
  d.setMonth(d.getMonth()+months);
  return d.toLocaleDateString('en-BW',{month:'short',year:'numeric'});
}

// RETIREMENT CALCULATOR
// ══════════════════════════════════════════════════════════════
window.RC = window.RC || {
  age: 0,
  retireAge: 65,
  lifeExpectancy: 85,
  currentSavings: 0,
  monthlyContrib: 0,
  annualReturn: 10,
  inflationRate: 5,
  incomeReplacement: 75
};

window.rcSave = async function(){
  if(!S.user) return;
  await sb.from('user_tools').upsert(
    {user_id:S.user.id, tool:'retire', data:RC, updated_at:new Date().toISOString()},
    {onConflict:'user_id,tool'}
  );
};

async function loadRetire(){
  if(!S.user) return;
  const {data} = await sb.from('user_tools').select('data')
    .eq('user_id',S.user.id).eq('tool','retire').single();
  if(data?.data) Object.assign(RC, data.data);
  // Auto-pull monthly contribution from savings budget
  const bd = S.bd||{};
  const budgetSavings = (bd.savings||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);
  if(budgetSavings > 0 && !RC._manualContrib) RC.monthlyContrib = budgetSavings;
  render();
}

window.rcUpdate = function(key, val){
  RC[key] = parseFloat(val)||0;
  if(key==='monthlyContrib') RC._manualContrib = true;
  rcSave();
  render();
};

// Core projection engine
function projectRetirement(){
  const yearsToRetire = Math.max(0, (RC.retireAge||65) - (RC.age||30));
  const yearsInRetire  = Math.max(0, (RC.lifeExpectancy||85) - (RC.retireAge||65));
  const monthlyReturn  = (RC.annualReturn||10) / 100 / 12;
  const realReturn     = ((1 + (RC.annualReturn||10)/100) / (1 + (RC.inflationRate||5)/100)) - 1;
  const realMonthly    = realReturn / 12;
  const n              = yearsToRetire * 12;

  // Future value of current savings
  const fvSavings = (RC.currentSavings||0) * Math.pow(1 + monthlyReturn, n);

  // Future value of monthly contributions (annuity)
  const fvContribs = monthlyReturn > 0
    ? (RC.monthlyContrib||0) * ((Math.pow(1 + monthlyReturn, n) - 1) / monthlyReturn)
    : (RC.monthlyContrib||0) * n;

  const totalAtRetire = fvSavings + fvContribs;

  // Monthly income from fund at retirement (real returns)
  const retireMonths = yearsInRetire * 12;
  const monthlyIncome = realMonthly > 0 && retireMonths > 0
    ? totalAtRetire * (realMonthly * Math.pow(1+realMonthly, retireMonths)) / (Math.pow(1+realMonthly, retireMonths)-1)
    : (retireMonths > 0 ? totalAtRetire / retireMonths : 0);

  // Target: % of current income
  const currentIncome = S.bd ? (S.bd.income||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0) : 0;
  const targetMonthly = currentIncome * ((RC.incomeReplacement||75)/100);

  // Gap
  const monthlyGap = Math.max(0, targetMonthly - monthlyIncome);

  // Required monthly contribution to close gap
  const requiredContrib = monthlyReturn > 0 && n > 0
    ? (targetMonthly * ((Math.pow(1+realMonthly,retireMonths)-1)/(realMonthly*Math.pow(1+realMonthly,retireMonths))) - (RC.currentSavings||0)*Math.pow(1+monthlyReturn,n))
      * (monthlyReturn / (Math.pow(1+monthlyReturn,n)-1))
    : 0;

  // Year-by-year data for chart (every 5 years)
  const chartData = [];
  let bal = RC.currentSavings||0;
  for(let m=0; m<=n; m++){
    bal = bal*(1+monthlyReturn) + (RC.monthlyContrib||0);
    if(m % 60 === 0) chartData.push({year: (RC.age||30) + m/12, balance: Math.round(bal)});
  }

  return {
    yearsToRetire, yearsInRetire, totalAtRetire,
    monthlyIncome, targetMonthly, monthlyGap,
    requiredContrib: Math.max(0, requiredContrib),
    currentIncome, chartData,
    onTrack: monthlyIncome >= targetMonthly
  };
}

function fmtM(n){
  const c = CURRENCIES[FX.currency]||CURRENCIES.BWP;
  const v = toFX(n||0);
  if(v>=1000000) return c.symbol+' '+(v/1000000).toFixed(2)+'M';
  if(v>=1000)    return c.symbol+' '+(v/1000).toFixed(1)+'K';
  return fmt(n);
}

function renderRetire(){
  const T  = tots();
  const P  = projectRetirement();
  const bd = S.bd||{};
  const budgetSavings = (bd.savings||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);

window.RE = window.RE || { items:[], nextId:1 };

window.reSave = async function(){
  if(!S.user) return;
  await sb.from('user_tools').upsert(
    {user_id:S.user.id, tool:'recurring', data:RE, updated_at:new Date().toISOString()},
    {onConflict:'user_id,tool'}
  );
};

async function loadRecurring(){
  if(!S.user) return;
  const {data} = await sb.from('user_tools').select('data')
    .eq('user_id',S.user.id).eq('tool','recurring').single();
  if(data?.data){ Object.assign(RE, data.data); if(!RE.nextId) RE.nextId=1; }
  // Auto-post any due recurring expenses for this month
  await autoPostRecurring();
  render();
}

// Check each recurring item — if not yet posted this month, post it
async function autoPostRecurring(){
  if(!S.user||!RE.items||!RE.items.length) return;
  const key = mk();
  // Get existing transactions for this month to avoid duplicates
  const {data:existing} = await sb.from('transactions').select('item_name,category')
    .eq('user_id',S.user.id).eq('month_key',key);
  const posted = new Set((existing||[]).map(t=>`${t.category}::${t.item_name}`));

  const toPost = RE.items.filter(r=>{
    if(!r.active) return false;
    return !posted.has(`${r.category}::${r.name}`);
  });

  if(!toPost.length) return;

  // Batch insert all due recurring expenses
  const rows = toPost.map(r=>({
    user_id: S.user.id,
    month_key: key,
    category: r.category,
    item_name: r.name,
    amount: r.amount,
    note: r.note||'Auto recurring',
    date: new Date().toISOString().split('T')[0],
  }));
  await sb.from('transactions').insert(rows);

  // Update lastPosted on each item
  toPost.forEach(r=>{ r.lastPosted = key; });
  reSave();

  if(toPost.length) toast(`${toPost.length} recurring expense${toPost.length>1?'s':''} auto-posted ↻`);
  loadT();
}

window.reAdd = function(){
  const name  = document.getElementById('re-name')?.value.trim();
  const amt   = parseFloat(document.getElementById('re-amt')?.value)||0;
  const cat   = document.getElementById('re-cat')?.value||'lifestyle';
  const note  = document.getElementById('re-note')?.value.trim();
  if(!name||!amt){ toast('Enter a name and amount'); return; }
  if(!RE.items) RE.items=[];
  RE.items.push({id:RE.nextId++, name, amount:amt, category:cat, note, active:true, lastPosted:null, createdOn:new Date().toISOString()});
  ['re-name','re-amt','re-note'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  reSave();
  toast('Recurring expense added ✓');
  render();
};

window.reToggle = function(id){
  const item = RE.items.find(r=>r.id===id);
  if(item){ item.active=!item.active; reSave(); render(); }
};

window.reRemove = function(id){
  const item=RE.items.find(r=>r.id===id);
  showConfirm('Remove "'+((item&&item.name)||'this item')+'"?',()=>{
    RE.items=RE.items.filter(r=>r.id!==id);
    reSave(); render();
  });
};

window.rePostNow = async function(id){
  const r = RE.items.find(x=>x.id===id);
  if(!r) return;
  await sb.from('transactions').insert({
    user_id:S.user.id, month_key:mk(),
    category:r.category, item_name:r.name,
    amount:r.amount, note:r.note||'Manually posted, recurring',
    date:new Date().toISOString().split('T')[0],
  });
  r.lastPosted = mk();
  reSave();
  toast(`${r.name} posted ✓`);
  loadT();
};

// ADVISOR DASHBOARD
// ══════════════════════════════════════════════════════════════
const ADVISOR_EMAIL = 'generationalwealthb@gmail.com';

let ADV = {
  clients: [],      // [{id, email, name, last_login, gap_data, budget_data, tx_data}]
  loading: true,
  filter: 'all',    // all | urgent | high | moderate | low
  search: '',
  selectedClient: null,
  modal: false,
};

function isAdvisor(){ return S.user?.email?.toLowerCase() === ADVISOR_EMAIL.toLowerCase(); }

// ── Load all client data ──────────────────────────────────────
async function loadAdvisorData(){
  ADV.loading = true; render();

  // 1. All user profiles (from profiles table)
  const { data: profiles } = await sb.from('profiles').select('*').neq('email', ADVISOR_EMAIL);
  if(!profiles){ ADV.loading=false; render(); return; }

  // 2. For each client, pull gap tool data + last budget + last_login
  const ids = profiles.map(p=>p.id);

  const [gapRes, budgetRes, txRes] = await Promise.all([
    sb.from('user_tools').select('user_id,data,updated_at').eq('tool','gap').in('user_id', ids),
    sb.from('budgets').select('user_id,month_key,categories,updated_at').in('user_id', ids).order('month_key',{ascending:false}),
    sb.from('transactions').select('user_id,created_at').in('user_id', ids).order('created_at',{ascending:false}),
  ]);

  const gapMap    = {};
  const budgetMap = {};
  const lastTxMap = {};

  (gapRes.data||[]).forEach(g => { gapMap[g.user_id] = g; });

  // Latest budget per user
  (budgetRes.data||[]).forEach(b => {
    if(!budgetMap[b.user_id]) budgetMap[b.user_id] = b;
  });

  // Latest tx per user
  (txRes.data||[]).forEach(t => {
    if(!lastTxMap[t.user_id]) lastTxMap[t.user_id] = t.created_at;
  });

  ADV.clients = profiles
    .filter(p => p.email?.toLowerCase() !== ADVISOR_EMAIL.toLowerCase())
    .map(p => {
      const gapEntry  = gapMap[p.id];
      const gc        = gapEntry?.data || {};
      const bEntry    = budgetMap[p.id];
      const bd        = bEntry?.categories || {};

      // Re-compute gap metrics from stored data
      const monthlyIncome  = (bd.income||[]).reduce((s,i)=>s+(parseFloat(i.budgeted)||0),0);
      const monthlyExp     = ['housing','transport','food','personal','lifestyle','giving']
        .reduce((s,k)=>s+(bd[k]||[]).reduce((a,i)=>a+(parseFloat(i.budgeted)||0),0),0);

      const savingsTotal  = gc.savings||0;
      const debtsTotal    = gc.debts||0;
      const coverExisting = gc.cover||0;
      const yearsNeeded   = gc.years||10;
      const annualIncome  = monthlyIncome*12;

      const totalNeed   = monthlyExp*12*yearsNeeded + debtsTotal;
      const totalHave   = savingsTotal + coverExisting;
      const gap         = Math.max(0, totalNeed - totalHave);
      const coveredPct  = totalNeed>0 ? Math.min(100,Math.round((totalHave/totalNeed)*100)) : 100;

      let riskScore = 0;
      if(monthlyIncome>0){
        const coverRatio   = coverExisting/Math.max(annualIncome,1);
        const savingsRatio = savingsTotal/Math.max(monthlyExp*6,1);
        const debtRatio    = debtsTotal/Math.max(annualIncome,1);
        riskScore = Math.min(100,Math.round(
          (1-Math.min(1,coverRatio/5))*40 +
          (1-Math.min(1,savingsRatio))*30 +
          Math.min(1,debtRatio)*30
        ));
      }
      const riskLabel = riskScore>=70?'High':riskScore>=40?'Moderate':'Low';

      // Last activity = latest of: last_login, last gap save, last budget save, last tx
      const dates = [
        p.last_sign_in_at||p.updated_at,
        gapEntry?.updated_at,
        bEntry?.updated_at,
        lastTxMap[p.id],
      ].filter(Boolean).map(d=>new Date(d).getTime());
      const lastActive = dates.length ? new Date(Math.max(...dates)) : null;
      const daysSince  = lastActive ? Math.floor((Date.now()-lastActive.getTime())/(1000*86400)) : 999;

      return {
        id: p.id, email: p.email,
        name: p.full_name || p.email?.split('@')[0] || 'Client',
        monthlyIncome, monthlyExp, gap, coveredPct,
        riskScore, riskLabel,
        totalNeed, totalHave, savingsTotal, debtsTotal, coverExisting,
        lastActive, daysSince,
        hasData: monthlyIncome>0 || gap>0 || savingsTotal>0,
        bd, gc,
      };
    });

  ADV.loading = false;
  render();
}

// ── Advisor formatting helpers ────────────────────────────────
function advFmt(n){
  const v = n||0;
  if(v>=1000000) return 'P '+( v/1000000).toFixed(1)+'M';
  if(v>=1000)    return 'P '+( v/1000   ).toFixed(0)+'K';
  return 'P '+v.toLocaleString('en-BW',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function urgencyClass(c){
  if(!c.hasData)    return 'none';
  if(c.daysSince>=30) return 'red';     // gone cold → urgent
  if(c.riskScore>=70) return 'red';
  if(c.riskScore>=40) return 'amber';
  return 'green';
}

function urgencyDotClass(c){
  const u = urgencyClass(c);
  return u==='red'?'red':u==='amber'?'amber':u==='green'?'green':'grey';
}

function activityText(c){
  if(!c.lastActive) return 'Never logged in';
  if(c.daysSince===0) return 'Active today';
  if(c.daysSince===1) return 'Yesterday';
  if(c.daysSince<7)   return c.daysSince+'d ago';
  if(c.daysSince<30)  return Math.floor(c.daysSince/7)+'w ago';
  return Math.floor(c.daysSince/30)+'mo ago. Follow up!';
}

function activityClass(c){
  if(c.daysSince>=30) return 'urgent';
  if(c.daysSince>=14) return 'warn';
  return 'ok';
}

function renderAdvisor(){
  const clients = ADV.clients;

  // Summary stats
  const total    = clients.length;
  const urgent   = clients.filter(c=>urgencyClass(c)==='red').length;
  const highRisk = clients.filter(c=>c.riskScore>=70).length;
  const inactive = clients.filter(c=>c.daysSince>=30).length;
  const totalGap = clients.reduce((s,c)=>s+c.gap,0);

  // Filter + search
  let filtered = clients;
  if(ADV.filter==='urgent')   filtered = clients.filter(c=>urgencyClass(c)==='red');
  if(ADV.filter==='high')     filtered = clients.filter(c=>c.riskScore>=70);
  if(ADV.filter==='moderate') filtered = clients.filter(c=>c.riskScore>=40&&c.riskScore<70);
  if(ADV.filter==='low')      filtered = clients.filter(c=>c.riskScore<40&&c.hasData);
  if(ADV.filter==='inactive') filtered = clients.filter(c=>c.daysSince>=30);
  if(ADV.search){
    const q = ADV.search.toLowerCase();
    filtered = filtered.filter(c=>c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q));

    const ua=urgencyClass(a)==='red'?0:urgencyClass(a)==='amber'?1:2;
    const ub=urgencyClass(b)==='red'?0:urgencyClass(b)==='amber'?1:2;

// ══════════════════════════════════════════════════════════════
// AUTH & SESSION BOOTSTRAP
// ══════════════════════════════════════════════════════════════

// Flag: true once initial session check is done
// Declared FIRST so onAuthStateChange can safely read it
let _sessionReady = false;

// Central loader — called once per session start
function _loadAll(user){
  S.user = user;
  render(); // show app shell immediately
  saveProfile(user);
  if(isAdvisor()){
    loadAdvisorData();
  } else {
    loadFX();
    loadB();
    loadT();
    loadH();
    loadGap();
    loadLoans();
    loadGoals();
    loadRetire();
    loadRecurring();
  }
}

// onAuthStateChange fires on EVERY page load AND on sign-in/out
// We use _sessionReady to ignore the initial page-load fire
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT'){
    // User explicitly signed out
    S.user = null; S.bd = null; S.tx = []; S.hist = [];
    _sessionReady = false;
    render();
    return;
  }
  if(event === 'SIGNED_IN' && _sessionReady && !S.user){
    // Fresh sign-in AFTER page already loaded (login form submit)
    _loadAll(session.user);
    return;
  }
  if(event === 'TOKEN_REFRESHED' && S.user){
    // Silent token refresh — just update user object, don't reload data
    S.user = session.user;
    return;
  }
});

// Show login screen immediately — don't wait for network
render();

// Initial page load — getSession is the source of truth
sb.auth.getSession().then(({data, error}) => {
  _sessionReady = true; // now onAuthStateChange can handle new sign-ins
  if(error){ console.error('getSession error:', error); render(); return; }
  if(data.session){
    _loadAll(data.session.user);
  } else {
    render(); // no session — show login screen
  }
});

// ── Save on page hide/close ────────────────────────────────────
// Helper: use sendBeacon so the request survives page unload
function _beaconSave(){
  if(!S.user||!S.bd) return;
  clearTimeout(saveTimer);
  const url=`https://tkhhzubopefzanezqzss.supabase.co/rest/v1/budgets`;
  const payload=JSON.stringify([{user_id:S.user.id,month_key:mk(),categories:S.bd,updated_at:new Date().toISOString()}]);
  // sendBeacon is fire-and-forget but guaranteed to complete even after page close
  if(navigator.sendBeacon){
    const blob=new Blob([payload],{type:'application/json'});
    navigator.sendBeacon(url,blob);
  }
  // Also attempt the normal async path — on visibilitychange the page is still alive
  sb.from('budgets').upsert(
    {user_id:S.user.id,month_key:mk(),categories:S.bd,updated_at:new Date().toISOString()},
    {onConflict:'user_id,month_key'}
  );
}

// visibilitychange fires on mobile when switching apps (most reliable)
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && S.user && S.bd) _beaconSave();
});

// beforeunload fires on desktop refresh/close
window.addEventListener('beforeunload', () => {
  if(S.user && S.bd) _beaconSave();
});
</script>

.progress-track{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(to right,var(--gold),var(--gold-lt));border-radius:2px;transition:width .5s ease;width:0%;}
.progress-label{display:flex;justify-content:space-between;margin-bottom:8px;}
.progress-step{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;}
.progress-count{font-size:10px;color:var(--gray);}

/* ── FORM WRAP ── */
.form-wrap{max-width:720px;margin:0 auto;padding:0 24px 80px;}

/* ── SECTION ── */
.form-section{display:none;}
.form-section.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.section-card{background:var(--navy);border:1px solid var(--gold-rule);border-radius:12px;padding:32px;margin-bottom:20px;position:relative;overflow:hidden;}
.section-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.section-num{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(12px,3.5vw,17px);font-weight:700;color:#fff;margin-bottom:3px;}
.section-sub{font-size:13px;font-weight:300;color:rgba(255,255,255,0.4);margin-bottom:28px;line-height:1.6;}

/* ── FORM ELEMENTS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:18px;}
.form-group{margin-bottom:18px;}
.f-label{display:block;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:7px;}
.f-label .opt{color:var(--gray);font-weight:400;letter-spacing:0;text-transform:none;font-size:10px;}
.f-input,.f-select,.f-textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:7px;padding:11px 14px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s,background .2s;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--gold);background:rgba(201,168,76,0.05);box-shadow:0 0 0 3px rgba(201,168,76,0.07);}
.f-input::placeholder,.f-textarea::placeholder{color:rgba(255,255,255,0.18);}
.f-select option{background:var(--navy);color:#fff;}
.f-textarea{resize:vertical;min-height:80px;line-height:1.6;}
.f-hint{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.5;}
.f-prefix{position:relative;}
.f-prefix-sym{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gold);font-family:'DM Mono',monospace;font-size:13px;font-weight:500;pointer-events:none;}
.f-prefix .f-input{padding-left:28px;}
.f-required{color:var(--red);margin-left:2px;}

/* Radio/check options */
.f-options{display:flex;flex-direction:column;gap:8px;}
.f-opt{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:7px;padding:10px 14px;cursor:pointer;transition:all .15s;}
.f-opt:hover{border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.04);}
.f-opt input{width:15px;height:15px;accent-color:var(--gold);flex-shrink:0;margin-top:2px;}
.f-opt:has(input:checked){border-color:var(--gold);background:rgba(201,168,76,0.07);}
.f-opt-text{font-size:13px;color:rgba(255,255,255,0.75);line-height:1.4;}
.f-opt-sub{font-size:11px;color:var(--gray);margin-top:2px;}

/* Conditional field */
.conditional{display:none;}
.conditional.show{display:block;animation:fadeUp .25s ease;}

/* ── BOOK INSIGHT ── */
.book-insight{background:rgba(201,168,76,0.05);border-left:3px solid var(--gold);border-radius:0 7px 7px 0;padding:14px 18px;margin:20px 0;}
.bi-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.bi-label::before{content:'📖';}
.bi-quote{font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;color:rgba(255,255,255,0.8);line-height:1.5;}

/* ── NAV BUTTONS ── */
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:7px;padding:13px 28px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:hover{background:var(--gold-lt);transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,168,76,0.3);}
.btn-ghost{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.08);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);}
.btn-lg{padding:16px 40px;font-size:14px;}

/* ── ERROR STATE ── */
.f-error{border-color:var(--red)!important;background:rgba(201,52,76,0.05)!important;}
.f-error-msg{font-size:11px;color:var(--red);margin-top:4px;display:none;}
.f-error-msg.show{display:block;}

/* ── THANK YOU ── */
#thankyou-screen{display:none;text-align:center;padding:80px 24px;}
.ty-icon{font-size:56px;margin-bottom:24px;}
.ty-title{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,4.5vw,26px);font-weight:700;color:#fff;margin-bottom:6px;line-height:1.1;}
.ty-title em{color:var(--gold);font-style:italic;}
.ty-sub{font-size:16px;font-weight:300;color:rgba(255,255,255,0.5);max-width:480px;margin:0 auto 36px;line-height:1.7;}
.ty-card{background:var(--navy);border:1px solid var(--gold-rule);border-radius:12px;padding:32px;max-width:480px;margin:0 auto 32px;position:relative;overflow:hidden;}
.ty-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.ty-card-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px;}
.ty-card-text{font-size:14px;font-weight:300;color:rgba(255,255,255,0.65);line-height:1.7;}
.ty-name{color:#fff;font-weight:600;}
.ty-gap{font-family:'DM Mono',monospace;font-size:clamp(12px,3.5vw,16px);color:var(--gold);display:block;margin:4px 0;}

/* ── SUBMITTING STATE ── */
.submitting-overlay{display:none;position:fixed;inset:0;background:rgba(6,15,30,0.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.submitting-overlay.show{display:flex;}
.spin{width:44px;height:44px;border:3px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.submitting-text{font-size:13px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}

@media(max-width:600px){
  .form-grid,.form-grid-3{grid-template-columns:1fr;}
  .site-header{padding:0 16px;}
  .section-card{padding:22px 18px;}
  .form-wrap,.progress-wrap{padding-left:16px;padding-right:16px;}
  .hero{padding:44px 16px 36px;}
  .btn-row{flex-direction:column-reverse;}
  .btn{width:100%;justify-content:center;}
}
</style>
</head>

    <div class="ty-card-text" style="font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:rgba(255,255,255,0.8);line-height:1.6;">
